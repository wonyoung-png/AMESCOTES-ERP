<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="google" content="notranslate" />
<title>AMESCOTES OS</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
<style>
  :root{
    --bg-canvas:#0B0B0C; --bg-surface:#141416; --bg-surface-2:#1A1A1D; --bg-subtle:#1F1F23;
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
    --text-primary:#EDEDEF; --text-secondary:rgba(255,255,255,0.62); --text-tertiary:rgba(255,255,255,0.42);
    --accent:#3DFFA2; --accent-weak:rgba(61,255,162,0.14);
    --danger:#FF8A94;
    --highlight-top:inset 0 1px 0 rgba(255,255,255,0.04);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    background:var(--bg-canvas); color:var(--text-primary);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; font-size:13px;
  }
  .wrap{width:100%;max-width:560px;padding:24px}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  h1{font-size:28px;font-weight:600;letter-spacing:-0.02em}
  .sub{font-size:13px;color:var(--text-tertiary);margin:6px 0 28px}
  .hidden{display:none}

  /* 로그인 */
  .card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--highlight-top);padding:24px;max-width:380px}
  label{display:block;font-size:12px;color:var(--text-secondary);margin:0 0 6px}
  input{width:100%;height:32px;background:var(--bg-subtle);border:1px solid var(--border);
    border-radius:8px;color:var(--text-primary);padding:0 10px;font-size:13px;
    font-family:inherit;margin-bottom:14px;outline:none}
  input:focus{border-color:var(--border-strong)}
  .btn{height:28px;padding:0 14px;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--text-primary);font-size:12px;font-weight:500;
    font-family:inherit;cursor:pointer}
  .btn.primary{background:var(--text-primary);color:var(--bg-canvas);border-color:transparent;width:100%;height:32px}
  .btn.primary:hover{background:#fff}
  .err{color:var(--danger);font-size:12px;margin:-6px 0 10px;min-height:14px}

  /* 런처 */
  .apps{display:flex;flex-direction:column;gap:12px}
  a.app{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;
    padding:18px 20px;box-shadow:var(--highlight-top);
    transition:background .15s ease,border-color .15s ease}
  a.app:hover{background:var(--bg-surface-2);border-color:var(--border-strong)}
  .tile{width:32px;height:32px;border-radius:8px;background:var(--bg-subtle);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .tile svg{width:16px;height:16px;stroke:var(--text-secondary);stroke-width:1.5;fill:none}
  .meta{flex:1;min-width:0}
  .name{font-size:14px;font-weight:600}
  .desc{font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.5}
  .go{font-size:12px;color:var(--text-tertiary)}
  .userbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-size:12px;color:var(--text-secondary)}
  .userbar b{color:var(--text-primary);font-weight:600}
  .foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;font-size:11px;color:var(--text-tertiary)}
  .foot a{color:var(--text-tertiary)}
</style>
</head>
<body>
  <main class="wrap">
    <div class="logo"><span class="logo-dot"></span><h1>AMESCOTES OS</h1></div>
    <p class="sub">전사 업무 플랫폼 — 로그인 한 번으로 모든 모듈 사용</p>

    <!-- 상태: 확인 중 -->
    <div id="checking">
      <p style="color:var(--text-tertiary)">Data Loading by AMESCOTES</p>
    </div>

    <!-- 로그인 -->
    <div id="login" class="hidden">
      <div class="card">
        <label for="email">이메일</label>
        <input id="email" type="email" placeholder="name@atlm.kr" autocomplete="username" />
        <label for="pw">비밀번호</label>
        <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" />
        <p class="err" id="err"></p>
        <button class="btn primary" id="loginBtn">로그인</button>
      </div>
    </div>

    <!-- 런처 -->
    <div id="launcher" class="hidden">
      <div class="userbar">
        <span><b id="uname"></b> <span id="urole"></span></span>
        <button class="btn" id="logoutBtn">로그아웃</button>
      </div>
      <nav class="apps">
        <a class="app" href="https://54-116-241-64.sslip.io/">
          <span class="tile"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg></span>
          <span class="meta">
            <span class="name">AMESCOTES ERP</span>
            <span class="desc">생산 · 발주 · BOM · 정산 · 거래처 — 제조 운영 전반</span>
          </span>
          <span class="go">열기 ↗</span>
        </a>
        <a class="app" href="https://daily.54-116-241-64.sslip.io/app/">
          <span class="tile"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg></span>
          <span class="meta">
            <span class="name">Daily Check</span>
            <span class="desc">일일 매출 · 캠페인 · 재고 · 물류 · AI 콘텐츠 — 판매 운영</span>
          </span>
          <span class="go">열기 ↗</span>
        </a>
        <a class="app" id="usersLink" href="https://54-116-241-64.sslip.io/users">
          <span class="tile"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M15 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0M22 21v-2a4 4 0 0 0-3-3.87"/></svg></span>
          <span class="meta">
            <span class="name">사용자 관리</span>
            <span class="desc">계정 초대 · 권한 · 비밀번호 — 관리자 전용</span>
          </span>
          <span class="go">열기 ↗</span>
        </a>
      </nav>
    </div>

    <div class="foot">
      <span>AMESCOTES OS · Dev by BGROW Corp</span>
      <span>개발문의 <a href="mailto:dev@bgrow.co.kr">dev@bgrow.co.kr</a></span>
    </div>
  </main>

<script>
const ERP = 'https://54-116-241-64.sslip.io';
const ADMINS = ['wonyoung@atlm.kr', 'saintluxpgw@bgrow.co.kr'];
const $ = id => document.getElementById(id);
function show(view) {
  for (const v of ['checking', 'login', 'launcher']) $(v).classList.toggle('hidden', v !== view);
}
function showLauncher(user) {
  $('uname').textContent = user.name || user.email;
  $('urole').textContent = user.role ? '· ' + user.role : '';
  $('usersLink').style.display = ADMINS.includes((user.email || '').toLowerCase()) ? '' : 'none';
  show('launcher');
}
async function checkSession() {
  try {
    const r = await fetch(ERP + '/api/session', { credentials: 'include' });
    if (r.ok) { showLauncher((await r.json()).user); return; }
  } catch (e) { /* 네트워크 오류 → 로그인 표시 */ }
  show('login');
}
async function doLogin() {
  $('err').textContent = '';
  const email = $('email').value.trim(), password = $('pw').value;
  if (!email || !password) { $('err').textContent = '이메일과 비밀번호를 입력하세요'; return; }
  $('loginBtn').disabled = true;
  try {
    const r = await fetch(ERP + '/api/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (r.ok) { showLauncher((await r.json()).user); }
    else $('err').textContent = '이메일 또는 비밀번호가 올바르지 않습니다';
  } catch (e) { $('err').textContent = '서버에 연결할 수 없습니다'; }
  $('loginBtn').disabled = false;
}
$('loginBtn').addEventListener('click', doLogin);
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('logoutBtn').addEventListener('click', async () => {
  try { await fetch(ERP + '/api/logout', { method: 'POST', credentials: 'include' }); } catch (e) {}
  show('login');
});
checkSession();
</script>
</body>
</html>
