# AMESCOTES ERP — 자체 호스팅 전체 스택 (앱 + Caddy + Postgres + PostgREST)
#
# 아키텍처: 브라우저 → Caddy(:80/:443)
#   /rest/v1/*  → PostgREST → Postgres
#   그 외       → Express 앱(:4000)
#
# 로컬 검증:  docker compose up -d --build  →  http://localhost
# EC2 운영:   동일 (SITE_ADDRESS만 도메인으로)
#
# 필요 .env: POSTGRES_PASSWORD, PGRST_AUTHENTICATOR_PASSWORD, PGRST_JWT_SECRET, SITE_ADDRESS

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGRST_AUTHENTICATOR_PASSWORD: ${PGRST_AUTHENTICATOR_PASSWORD:?}
    volumes:
      - db_data:/var/lib/postgresql/data
      # 초기화(빈 볼륨 최초 1회, 이름순 실행): 롤 → 스키마 → 마이그레이션 → 권한
      - ./db/00_roles.sh:/docker-entrypoint-initdb.d/00_roles.sh:ro
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./supabase/migration_phase1_manufacturing.sql:/docker-entrypoint-initdb.d/02_phase1.sql:ro
      - ./supabase/migration_add_missing_columns.sql:/docker-entrypoint-initdb.d/03_add_missing.sql:ro
      - ./supabase/migration_add_packing_columns.sql:/docker-entrypoint-initdb.d/04_packing.sql:ro
      - ./supabase/migration_add_post_cost_to_items.sql:/docker-entrypoint-initdb.d/05_post_cost.sql:ro
      - ./db/06_unique_keys_partial.sql:/docker-entrypoint-initdb.d/06_unique_keys.sql:ro
      - ./db/07_prod_schema_drift.sql:/docker-entrypoint-initdb.d/07_prod_schema_drift.sql:ro
      - ./db/08_app_users.sql:/docker-entrypoint-initdb.d/08_app_users.sql:ro
      - ./db/10_operations.sql:/docker-entrypoint-initdb.d/10_operations.sql:ro
      # 접수함 — 99_grants 보다 먼저 와야 테이블이 있고, 잠금(14)은 그 뒤에 와야 revoke 가 안 덮인다
      - ./supabase/migration_capture_inbox.sql:/docker-entrypoint-initdb.d/13_capture_inbox.sql:ro
      - ./db/99_grants.sh:/docker-entrypoint-initdb.d/99_grants.sh:ro
      - ./supabase/migration_capture_inbox_2_lock.sql:/docker-entrypoint-initdb.d/zz_capture_lock.sql:ro
      # 미포함: migration_rls_step1.sql (Supabase Auth 전제 — 레거시 인증 유지로 의도적 스킵)
      #         migration_at_*/set_* (데이터 보정 스크립트 — 백업 데이터에 이미 반영됨)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${PGRST_AUTHENTICATOR_PASSWORD:?}@db:5432/erp
      PGRST_DB_SCHEMAS: public
      # PGRST_DB_ANON_ROLE 미설정 = 무토큰 요청 401 (로그인 토큰 필수)
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?}

  app:
    build:
      context: .
    image: amescotes-erp:local
    restart: unless-stopped
    depends_on:
      - postgrest
    environment:
      PORT: "4000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SHARE_USER: ${SHARE_USER:-}
      SHARE_PASS: ${SHARE_PASS:-}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?}
      DAILY_URL: ${DAILY_URL:-http://daily:8000}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
