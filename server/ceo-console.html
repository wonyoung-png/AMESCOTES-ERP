<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>대표실 · AMESCOTES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/*
 * 대표실 — 대표 한 사람이 회사 전체를 보고, 결정하고, 묻는 화면.
 * 레이아웃: 왼쪽 메뉴 · 가운데 내용 · 오른쪽 고정 비서실장 패널 (Cofounder 구조)
 * 톤: 옅은 회색 캔버스, 얇은 선, 명조 인사말 하나, 하늘 커버 하나로만 온기를 준다
 */
:root{
  --canvas:#f3f3f1; --panel:#ffffff; --ink:#1b1c1e; --sub:#5c5e63; --faint:#6f7176; --line:#e5e5e2;
  --hover:#f0f0ed; --accent:#2c5446; --accent-ink:#ffffff; --sun:#e2a93b; --danger:#b4413a; --ok:#2f7a55;
  --sky1:#bcd6ee; --sky2:#e7f0f8; --cloud:rgba(255,255,255,.85);
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --serif:var(--sans);
  --ease:cubic-bezier(.2,0,0,1); --fast:140ms; --slow:280ms;
}
@media (prefers-color-scheme:dark){:root{
  --canvas:#141516; --panel:#1b1c1e; --ink:#ececea; --sub:#b0b2b7; --faint:#93959a; --line:#2b2c2f;
  --hover:#222326; --accent:#8fc4ad; --accent-ink:#10201a; --sun:#e9b44f; --danger:#ff8a80; --ok:#6fd3a0;
  --sky1:#24364a; --sky2:#1b2733; --cloud:rgba(255,255,255,.10); color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:208px minmax(0,1fr) 400px;height:100%}
@media (max-width:1180px){.app{grid-template-columns:208px minmax(0,1fr)}.ai{position:fixed;inset:0 0 0 auto;width:min(420px,100%);transform:translateX(102%);transition:transform var(--slow) var(--ease);z-index:20;box-shadow:-20px 0 40px -20px rgba(0,0,0,.25)}.ai.open{transform:none}.ai-toggle{display:flex!important}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.nav{display:none}}

/* 왼쪽 메뉴 */
.nav{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--canvas)}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 18px;font-weight:600;letter-spacing:-.01em}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--sun);display:grid;place-items:center;font-style:normal;font-size:12px;color:#3a2a06}
.brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:0}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--sub);text-decoration:none;transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.nav a .n{margin-left:auto;font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--canvas);display:grid;place-items:center}
.nav a.soon{opacity:.55;pointer-events:none}
.nav a.soon::after{content:"곧";margin-left:auto;font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.nav .foot{margin-top:auto;font-size:12px;color:var(--faint);padding:8px 10px}

/* 가운데 */
.main{overflow-y:auto;padding:24px clamp(16px,3vw,40px) 64px}
.inner{max-width:880px;margin:0 auto;display:grid;gap:28px}
.top{display:flex;align-items:center;gap:10px}
.top .crumb{color:var(--faint);font-size:13px}
.ai-toggle{display:none;margin-left:auto;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer}

.cover{position:relative;height:168px;border-radius:16px;overflow:hidden;
  background:radial-gradient(60px 22px at 18% 38%,var(--cloud),transparent 70%),radial-gradient(90px 26px at 26% 42%,var(--cloud),transparent 70%),
  radial-gradient(70px 20px at 72% 30%,var(--cloud),transparent 70%),radial-gradient(110px 28px at 82% 36%,var(--cloud),transparent 70%),
  linear-gradient(180deg,var(--sky1),var(--sky2))}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,transparent,rgba(120,160,110,.28))}
.hello{display:grid;gap:4px}
.hello h1{margin:0;font:600 30px/1.25 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.hello p{margin:0;color:var(--sub)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.stat b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--sub)}
.stat.warn b{color:var(--danger)}

.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:8px}
.sec-h h2{margin:0;font-size:15px;font-weight:600}
.sec-h span{color:var(--faint);font-size:12px}
.sec-h a{margin-left:auto;font-size:12px;color:var(--sub);text-decoration:none}
.sec-h a:hover{color:var(--ink)}

.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .k{font-size:11px;font-weight:500;padding:2px 7px;border-radius:5px;background:var(--hover);color:var(--sub);white-space:nowrap;margin-top:2px}
.item .k.req{background:#fbefdc;color:#8a5a12}.item .k.todo{background:#e6eef9;color:#2d4f86}.item .k.sch{background:#e5f2ec;color:#2c5446}.item .k.cap{background:#f1e9f7;color:#6a3f8a}
@media (prefers-color-scheme:dark){.item .k.req{background:#3a2c14;color:#f0c27a}.item .k.todo{background:#1c2a3d;color:#9dbbe8}.item .k.sch{background:#173026;color:#8fc4ad}.item .k.cap{background:#2c2036;color:#cfa8ea}}
.item .t{min-width:0;display:grid;gap:3px}
.item .t p{margin:0;word-break:break-word}
.item .t small{color:var(--faint);font-size:12px}
.item .t .rep{font-size:12px;color:var(--sub);background:var(--hover);border-radius:6px;padding:4px 8px}
.item .when{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.act{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.act input{flex:1;min-width:140px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--canvas);padding:0 10px}
.btn{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap;transition:background var(--fast) var(--ease),transform var(--fast) var(--ease)}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.empty{padding:22px 14px;text-align:center;color:var(--faint)}

.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.team h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.team h3 i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.team h3 i.idle{background:var(--faint)}.team h3 i.warn{background:var(--danger)}
.team dl{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.team dt{font-size:11px;color:var(--faint)}.team dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.team p{margin:0;font-size:12px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.cal .item{grid-template-columns:52px minmax(0,1fr) auto}
.date{display:grid;justify-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;line-height:1.1}
.date b{font-size:17px;font-weight:600}.date small{font-size:10px;color:var(--faint)}

.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.up{color:var(--danger)}.down{color:#2d5fb8}

/* 오른쪽 비서실장 */
.ai{background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
.ai-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ai-h b{font-weight:600}.ai-h small{color:var(--faint);font-size:12px}
.ai-h button{margin-left:auto;border:0;background:none;color:var(--sub);cursor:pointer;font-size:12px}
.msgs{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;animation:in var(--slow) var(--ease)}
.m.u{align-self:flex-end;background:var(--ink);color:var(--canvas);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--canvas);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.wait{color:var(--sub);display:flex;gap:10px}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sugs{display:grid;gap:6px}
.sugs button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--sub)}
.sugs button:hover{color:var(--ink);background:var(--hover)}
.ask{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;resize:none;min-height:42px;max-height:160px;border:1px solid var(--line);border-radius:10px;background:var(--canvas);padding:10px 12px}
.ask button{height:42px;width:42px;border-radius:10px;border:0;background:var(--ink);color:var(--canvas);cursor:pointer}
.ask button:disabled{opacity:.4}
.err{color:var(--danger);font-size:12px;padding:0 16px 8px}

/* 회사 지도 — 대표실을 가운데 두고 팀 에이전트가 둘레에. 일하는 팀은 파동, 대표에게 오는 보고는 선을 타고 흐른다 */
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;place-items:center}
.mapbox svg{width:100%;max-width:720px;height:auto;overflow:visible}
.map-ring{fill:none;stroke:var(--line)}
.map-link{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 5}
.map-link.work{stroke:var(--accent);animation:flow 1.4s linear infinite}
.map-link.report,.map-link.warn{stroke:var(--danger);animation:flow .7s linear infinite}
.map-node{cursor:pointer;outline:none}
.map-node circle.card{fill:var(--panel);stroke:var(--line);transition:stroke var(--fast) var(--ease),fill var(--fast) var(--ease)}
.map-node:hover circle.card,.map-node:focus-visible circle.card,.map-node.sel circle.card{stroke:var(--sun);stroke-width:2;fill:#1d2922}
.map-node text{fill:var(--ink);font:600 13px var(--sans)}
.map-node text.s{fill:var(--sub);font:400 11px var(--sans)}
.map-pulse{fill:none;stroke:var(--accent);transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
.map-pulse.report,.map-pulse.warn{stroke:var(--danger)}
.map-core circle{fill:var(--sun)}.map-core text{fill:#172019;font:700 14px var(--sans)}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.agent-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.agent-h h3{margin:0;font-size:17px;font-weight:600}
.agent-h .pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px}
.agent-h small{color:var(--faint);font-size:12px}
.agent-h .btn{margin-left:auto}
.agent .head{margin:0;font:600 18px/1.4 var(--serif)}
.agent .sum{margin:0;white-space:pre-wrap;color:var(--sub)}
.agent .nums{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--sub)}
.agent .nums b{color:var(--ink);font-size:15px;margin-right:3px;font-variant-numeric:tabular-nums}
.agent ul{margin:0;padding-left:18px;display:grid;gap:4px}
.map-div rect{fill:var(--canvas);stroke:var(--line)}.map-div text{fill:var(--sub);font:600 12px var(--sans)}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.ppl span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.ppl span.off{color:var(--faint);border-style:dashed}
.ppl small{color:var(--faint);font-size:11px}
.order{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.order label{font-weight:600;font-size:13px}
.order textarea{resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--canvas);padding:10px 12px;font:inherit}
.order .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cap-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px;margin:0}
.cap-view dt{font-size:11px;color:var(--faint)}
.cap-view dd{margin:2px 0 0;font-size:14px;color:var(--ink)}
.cap-view dd.empty{color:var(--faint)}
.cap-form .hint.warn{color:var(--danger)}
.cap-item{border-bottom:1px solid var(--line)}
.cap-item:last-child{border-bottom:0}
.cap-item summary{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;list-style:none}
.cap-item summary::-webkit-details-marker{display:none}
.cap-item summary::before{content:'›';color:var(--faint);transition:transform var(--fast) var(--ease)}
.cap-item[open] summary::before{transform:rotate(90deg)}
.cap-item summary:hover{background:var(--hover)}
.cap-item .cap-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-item summary small{color:var(--faint);font-size:12px;white-space:nowrap}
.cap-item .cap-form{padding:0 16px 16px 34px;margin-top:0}
.cap-form{display:grid;gap:10px;margin-top:10px}
.cap-photo{max-width:220px;max-height:220px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:var(--canvas)}
.cap-form input,.cap-form select{border:1px solid var(--line);border-radius:8px;background:var(--canvas);padding:7px 9px;font:inherit;font-size:13px;color:var(--ink);min-width:0}
.cap-form .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cap-form .act input{flex:1;min-width:140px}
.cap-form .hint{margin:0;font-size:12px;color:var(--sub)}
.cap-form a.btn{justify-self:start;text-decoration:none;display:inline-grid;place-items:center}
.order label small,.order .row small{font-weight:400;color:var(--faint);font-size:12px;margin-left:6px}
.facts summary{cursor:pointer;font-size:13px;color:var(--sub)}
.facts pre{margin:8px 0 0;white-space:pre-wrap;font:12px/1.6 var(--sans);color:var(--sub);background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:320px;overflow:auto}
.order input[type=date]{border:1px solid var(--line);border-radius:8px;background:var(--canvas);padding:6px 8px;font:inherit}

/* C direction — 대표 전용 원형 조직 지도 */
:root{color-scheme:dark;--canvas:#0f1511;--panel:#161d18;--ink:#edf2ed;--sub:#a6b0a8;--faint:#7f8c83;--line:#2d3932;--hover:#1d2720;--accent:#d9bb62;--accent-ink:#172019;--sun:#d9bb62;--danger:#d87563;--ok:#79bb8a;--sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;--serif:var(--sans)}
.cover{display:none}.hello h1{font:650 30px/1.25 var(--sans);letter-spacing:-.035em}.app{grid-template-columns:224px minmax(0,1fr) 400px}.nav{background:#111713}.nav a.on{background:#edf2ed;color:#172019;box-shadow:none}.brand i{border-radius:50%;background:var(--sun)}
.stat,.list,.team,.agent,.mapbox{box-shadow:none}.mapbox{background:#111713;padding:18px}.map-ring{stroke:#314138}.map-link{stroke:#33423a}.map-node text{font-family:var(--sans)}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="대표실 메뉴">
    <div class="brand"><i aria-hidden="true">✦</i><span>대표실<small>AMESCOTES</small></span></div>
    <a href="#home" data-v="home">홈</a>
    <a href="#inbox" data-v="inbox">결정할 것<span class="n" id="navN" hidden>0</span></a>
    <a href="#map" data-v="map">회사 지도</a>
    <a class="soon">회사 기억</a>
    <div class="sep"></div>
    <a id="erpLink" href="#" target="_blank" rel="noopener">ERP 열기 ↗</a>
    <div class="foot" id="who"></div>
  </nav>

  <main class="main" id="main">
    <div class="inner">
      <div class="top"><span class="crumb" id="crumb">홈</span>
        <button class="ai-toggle" id="aiToggle" type="button">비서실장</button></div>
      <div id="view"><p class="empty">불러오는 중…</p></div>
    </div>
  </main>

  <aside class="ai" id="ai" aria-label="비서실장">
    <div class="ai-h"><b>비서실장</b><small>전 팀 기록·매출을 보고 답합니다</small>
      <button type="button" id="aiClose" hidden>닫기</button></div>
    <div class="msgs" id="msgs">
      <div class="sugs" id="sugs">
        <button type="button">오늘 내가 결정할 게 뭐야?</button>
        <button type="button">팀별로 이번 주 진행 상황 요약해줘</button>
        <button type="button">다가오는 기획전이랑 준비 상태 정리해줘</button>
        <button type="button">최근 매출 흐름 어때?</button>
      </div>
    </div>
    <div class="err" id="aiErr" hidden></div>
    <form class="ask" id="askForm">
      <label for="q" hidden>질문</label>
      <textarea id="q" rows="1" placeholder="회사에 대해 무엇이든 물어보세요"></textarea>
      <button type="submit" id="askBtn" aria-label="보내기">↑</button>
    </form>
  </aside>
</div>

<script>
// 직원이 쓴 글이 화면에 그대로 들어간다 — 모든 문자열은 esc() 를 거쳐야 한다
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (typeof v === 'number' && Number.isFinite(v)) ? v : null; // PMS 값도 화면에 넣기 전에 숫자로 거른다
const won = n => n == null ? '–' : (Math.abs(n) >= 1e8 ? (n/1e8).toFixed(2).replace(/\.?0+$/,'') + '억' : Math.round(n/1e4).toLocaleString() + '만') + '원';
const kst = iso => new Date(iso).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const KIND = { request_check:['확인 요청','req'], todo:['할 일','todo'], schedule:['일정','sch'], share:['공유',''], capture:['현장 접수','cap'] };
let D = null;

async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', credentials: 'include', cache: 'no-store',
    headers: body ? {'Content-Type':'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || j.error || 'HTTP ' + r.status), { status: r.status });
  return j;
}

async function load() {
  try { D = await api('/api/ceo/overview'); }
  catch (e) { document.getElementById('view').innerHTML = `<p class="empty">불러오지 못했습니다 (${esc(e.message)}). 새로고침해 보세요.</p>`; return; }
  document.getElementById('who').textContent = D.me.name + ' · ' + D.me.email;
  document.getElementById('erpLink').href = D.erpUrl;
  const n = D.decide.length + D.captures.length;
  const nav = document.getElementById('navN'); nav.hidden = !n; nav.textContent = n;
  render();
}

function greet() {
  const h = Number(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul',hour:'numeric',hour12:false}));
  const w = h < 6 ? '늦은 밤이에요' : h < 12 ? '좋은 아침이에요' : h < 18 ? '좋은 오후예요' : '좋은 저녁이에요';
  const name = (D.me.name || '').replace(/^이/, '') || D.me.name;
  return `${w}, ${name}님`;
}

function itemHtml(c, withActions) {
  const [label, cls] = KIND[c.kind] || ['업무',''];
  const due = c.parsed?.dueDate ? ` · 마감 ${esc(c.parsed.dueDate)}` : '';
  const meta = `${esc(c.created_by_name || '')}${c.team ? ' · ' + esc(c.team) : ''}${due}`;
  let act = '';
  if (withActions) {
    if (c.kind === 'request_check') act = `<div class="act"><input id="r-${esc(c.id)}" placeholder="답변 (예: 20%로 진행)"><button class="btn pri" data-a="reply" data-id="${esc(c.id)}">답변</button></div>`;
    else if (c.kind === 'todo') act = `<div class="act"><input id="r-${esc(c.id)}" placeholder="결과 한 줄 (선택)"><button class="btn pri" data-a="done" data-id="${esc(c.id)}">완료</button></div>`;
    else if (c.kind === 'schedule') {
      const p = c.parsed || {};
      act = `<div class="act"><small style="flex-basis:100%;color:var(--sub)">${esc(p.startDate || '날짜 없음')}${p.endDate && p.endDate !== p.startDate ? '~' + esc(p.endDate) : ''} · ${esc(p.channel || '채널 미정')}${p.discountRate != null ? ' · ' + esc(p.discountRate) + '%' : ''} · 알림: ${esc((p.shareTeams || []).join(', ') || '없음')}</small>
        <button class="btn pri" data-a="confirm" data-id="${esc(c.id)}">캘린더 등록</button></div>`;
    }
  }
  return `<div class="item"><span class="k ${cls}">${label}</span>
    <div class="t"><p>${esc(c.raw_text)}</p><small>${meta}</small>${c.reply_text ? `<span class="rep">${esc(c.replied_by_name)}: ${esc(c.reply_text)}</span>` : ''}${act}</div>
    <span class="when">${kst(c.created_at)}</span></div>`;
}

/**
 * 접수 바로 승인 — ERP 접수함(CaptureInbox.tsx)과 같은 값을 같은 API(/api/captures/:id/approve)로 보낸다.
 * 메인 납품은 발주를 골라야 해서 ERP 로 보낸다. 승인 권한·검증은 서버가 다시 한다.

/**
 * 10/8 대표: 승인자는 고치지 않는다 — 올린 사람이 쓴 그대로 보고 승인하거나, 모자라면 반려(보완 요청)한다.
 * 그래서 입력칸 없이 읽기 전용으로 보여준다. 필수값이 비면 승인 버튼을 막고 반려 사유를 미리 적어 둔다.
 */
const CAP_REQUIRED = { sample: [['styleName', '품명']], material: [['styleName', '품목'], ['amountKrw', '금액']] };
function captureForm(c) {
  const p = c.parsed || {}, kind = c.kind;
  const won = n => Number(n) > 0 ? Number(n).toLocaleString() + '원' : '';
  const buyer = id => { const b = (D.buyers || []).find(x => x.id === String(id)); return b ? (b.brands.map(x => x.name).join('·') || b.name) : `(목록에 없는 거래처 ${id})`; };
  const rows = kind === 'sample'
    ? [['품명', p.styleName], ['품번', p.styleNo], ['브랜드', p.brand], ['컬러', p.color], ['단계', p.stage], ['수량', p.qty], ['금액', won(p.amountKrw)]]
    : kind === 'material'
    ? [['품목', p.styleName], ['금액', won(p.amountKrw)], ['거래처', p.vendorName], ['결제수단', p.expenseType || '법인카드 (안 적혀 기본값)'], ['지출일', p.requestDate],
       ['바이어 청구', p.billBuyerId ? `${buyer(p.billBuyerId)} ${won(p.billAmountKrw)}` : '']]
    : [];
  const photo = c.has_photo ? `/api/ceo/capture-photo/${encodeURIComponent(c.id)}` : '';
  const missing = (CAP_REQUIRED[kind] || []).filter(([k]) => kind === 'material' && k === 'amountKrw' ? !(Number(p[k]) > 0) : !String(p[k] ?? '').trim()).map(([, l]) => l);
  const ready = (kind === 'sample' || kind === 'material') && !missing.length;
  const why = kind === 'delivery' ? '메인 납품은 어느 발주인지 골라야 해서 ERP 접수함에서 처리해요'
    : !(kind === 'sample' || kind === 'material') ? `AI 가 종류를 못 가렸어요 (${CAP_KIND[kind] || kind}) — 종류를 적어 다시 올리게 반려하세요`
    : missing.length ? `${missing.join('·')}이(가) 비어 있어 승인할 수 없어요 — 반려해서 보완을 요청하세요` : '';
  const reason = capEdit[c.id]?._reason ?? (missing.length ? `${missing.join('·')}을(를) 적어서 다시 올려주세요` : '');
  return `<div class="cap-form" data-cap="${esc(c.id)}">
    ${photo ? `<img class="cap-photo" src="${esc(photo)}" alt="접수 사진" loading="lazy">` : ''}
    <dl class="cap-view">${rows.map(([l, val]) => `<div><dt>${l}</dt><dd${val === '' || val == null ? ' class="empty"' : ''}>${esc(val === '' || val == null ? '—' : val)}</dd></div>`).join('')}</dl>
    ${why ? `<p class="hint${missing.length ? ' warn' : ''}">${esc(why)}</p>` : ''}
    <div class="act">
      ${kind === 'delivery' ? `<a class="btn" href="${esc(D.erpUrl)}/inbox" target="_blank" rel="noopener">ERP 접수함 열기 ↗</a>`
        : `<button class="btn pri" type="button" data-capact="approve"${ready ? '' : ' disabled'}>승인</button>`}
      <input data-k="_reason" placeholder="반려 사유 (올린 사람에게 그대로 보여요)" value="${esc(reason)}"><button class="btn" type="button" data-capact="reject">반려</button>
    </div>
  </div>`;
}

function inbox() {
  const groups = [
    ['확인 요청', D.decide.filter(c => c.kind === 'request_check')],
    ['내 할 일', D.decide.filter(c => c.kind === 'todo')],
    ['캘린더 등록 대기', D.decide.filter(c => c.kind === 'schedule')],
  ];
  const sec = groups.map(([t, list]) => `<section class="sec"><div class="sec-h"><h2>${t}</h2><span>${list.length}건</span></div>
    <div class="list">${list.map(c => itemHtml(c, true)).join('') || '<p class="empty">없어요</p>'}</div></section>`).join('');
  return sec + `<section class="sec"><div class="sec-h"><h2>현장 접수 승인 대기</h2><span>${D.captures.length}건 · 사진·내용 확인하고 고쳐서 승인</span></div>
    <div class="list">${D.captures.map(c => captureHtml(c, true)).join('') || '<p class="empty">없어요</p>'}</div></section>`;
}

// ───────── 회사 지도
const AST = { work:['작업 중','#e3efe8','#2f7a55'], idle:['대기','#efeff1','#5d5f64'], warn:['막힘','#fde4e1','#b3392f'], report:['보고 중','#fff1c9','#8a5a00'] };
let selTeam = null;
function agentList() {
  // 조직도 순서대로 14팀. 점검 기록이 없는 팀도 보인다 (아직 점검 전). 어느 팀에도 못 붙인 업무가 있으면 '팀 미지정'
  const by = new Map((D.agents || []).map(a => [a.team, a]));
  const keys = D.org.teams.map(t => t.key);
  const extra = D.teams.find(t => t.team === '팀 미지정' && (t.open || t.newToday));
  if (extra) keys.push(extra.team);
  return keys.map(k => {
    const t = D.teams.find(x => x.team === k) || { open: 0, overdue: 0, doneToday: 0, newToday: 0 };
    const org = D.org.teams.find(x => x.key === k);
    const a = by.get(k) || { team: k, status: t.open ? 'work' : 'idle', headline: '아직 점검 전이에요', summary: null, needs: [], stats: {}, created_at: null };
    const w = (D.watch || []).find(x => x.team === k);
    return { ...a, division: org ? org.division : '대표 직속', status: t.overdue || w?.alerts ? 'warn'
      : D.decide.some(c => c.kind === 'request_check' && c._org === k) ? 'report' : t.open || t.newToday ? 'work' : 'idle',
      headline: (a.stale ? '[오늘 이전 보고] ' : '') + a.headline,
      stats: { ...a.stats, open: t.open, overdue: t.overdue, doneToday: t.doneToday, newToday: t.newToday,
        toCeo: D.decide.filter(c => c.kind === 'request_check' && c._org === k).length,
        alerts: w?.alerts || 0, facts: w?.facts || a.stats?.facts || [] }, liveFacts: !!w };
  });
}
function mapView() {
  const list = agentList();
  if (!selTeam || !list.some(a => a.team === selTeam)) selTeam = (list.find(a => a.status === 'report' || a.status === 'warn') || list[0]).team;
  // 바깥 원 = 팀, 안쪽 원 = 본부. 본부 사이에 한 칸씩 띄워 묶음이 보이게
  const divs = D.org.divisions;
  const slots = []; let s = 0;
  divs.forEach(d => { list.forEach((a, i) => { if (a.division === d) slots[i] = s++; }); s += 0.6; });
  const total = s, RX = 400, RY = 250;
  const ang = i => -Math.PI / 2 + (slots[i] + 0.5) * 2 * Math.PI / total;
  const pos = list.map((_, i) => [Math.round(Math.cos(ang(i)) * RX), Math.round(Math.sin(ang(i)) * RY)]);
  const dpos = divs.map(d => {
    const idx = list.map((a, i) => a.division === d ? i : -1).filter(i => i >= 0);
    const m = idx.reduce((v, i) => v + ang(i), 0) / idx.length;
    return [Math.round(Math.cos(m) * RX * .45), Math.round(Math.sin(m) * RY * .45)];
  });
  const dstat = d => { const st = list.filter(a => a.division === d).map(a => a.status); return st.includes('warn') ? 'warn' : st.includes('report') ? 'report' : st.includes('work') ? 'work' : ''; };
  const links = list.map((a, i) => { const d = dpos[divs.indexOf(a.division)]; return `<line class="map-link ${esc(a.status)}" x1="${pos[i][0]}" y1="${pos[i][1]}" x2="${d[0]}" y2="${d[1]}"/>`; }).join('')
    + divs.map((d, j) => `<line class="map-link ${dstat(d)}" x1="${dpos[j][0]}" y1="${dpos[j][1]}" x2="0" y2="0"/>`).join('');
  const dnodes = divs.map((d, j) => `<g class="map-div" transform="translate(${dpos[j][0]},${dpos[j][1]})"><rect x="-46" y="-15" width="92" height="30" rx="15"/><text x="0" y="5" text-anchor="middle">${esc(d)}</text></g>`).join('');
  const nodes = list.map((a, i) => {
    const [x, y] = pos[i], st = AST[a.status] || AST.idle;
    return `<g class="map-node${a.team === selTeam ? ' sel' : ''}" data-team="${esc(a.team)}" transform="translate(${x},${y})" tabindex="0" role="button" aria-label="${esc(a.team)} ${st[0]}">
      ${a.status !== 'idle' ? `<circle class="map-pulse ${esc(a.status)}" r="47"/>` : ''}
      <circle class="card" r="42"/>
      <circle cx="0" cy="-17" r="4" fill="${st[2]}"/><text x="0" y="1" text-anchor="middle">${esc(a.team)}</text>
      <text class="s" x="0" y="20" text-anchor="middle">${st[0]}${a.stats?.open ? ' · ' + a.stats.open + '건' : ''}</text></g>`;
  }).join('');
  const a = list.find(x => x.team === selTeam);
  const st = a ? (AST[a.status] || AST.idle) : null;
  const detail = a ? `<section class="agent" aria-live="polite">
      <div class="agent-h"><h3>${esc(a.team)} 에이전트</h3><span class="pill" style="background:${st[1]};color:${st[2]}">${st[0]}</span>
        <small>${a.created_at ? 'AI 보고 ' + kst(a.created_at) : 'AI 보고 전'} · 현재 조회 ${kst(D.checkedAt)}</small>
        <button class="btn" type="button" data-run="${esc(a.team)}">이 팀 지금 점검</button></div>
      <p class="head">${esc(a.headline)}</p>
      ${a.summary ? `<p class="sum">${esc(a.summary)}</p>` : ''}
      <div class="nums"><span><b>${num(a.stats?.open) ?? 0}</b>진행 중</span><span><b>${num(a.stats?.overdue) ?? 0}</b>마감 지남</span><span><b>${num(a.stats?.toCeo) ?? 0}</b>대표 확인 요청</span><span><b>${(D.orders || []).filter(o => o.team === a.team && o.status === 'open').length}</b>내 지시 진행</span><span><b>${num(a.stats?.doneToday) ?? 0}</b>오늘 완료</span></div>
      ${a.needs?.length ? `<div><div class="sec-h"><h2>보고 당시 확인 제안</h2><span>${kst(a.created_at)} 기준 · 현재 근거 확인 후 결정</span></div><ul>${a.needs.map(x => `<li>${esc(x.text)}</li>`).join('')}</ul></div>` : ''}
      ${facts(a)}
      ${people(a.team)}
      ${ordersOf(a.team)}
      ${watchForm(a.team)}
      <form class="order" data-team="${esc(a.team)}">
        <label for="ord-t">이 팀에 지시</label>
        <textarea id="ord-t" rows="2" maxlength="1000" placeholder="예: 10/20 W컨셉 기획전 상품 리스트 금요일까지 정리"></textarea>
        <div class="row"><input id="ord-d" type="date" aria-label="마감일 (선택)"><button class="btn pri" type="submit">지시 보내기</button></div>
      </form>
    </section>` : '<p class="empty">팀이 없어요</p>';
  const last = (D.agents || []).map(x => x.created_at).sort().pop();
  return `<div class="sec-h"><h2>회사 지도</h2><span>${last ? '마지막 점검 ' + kst(last) + ' · 매일 아침 8:30 자동' : '매일 아침 8:30 자동 점검'}</span>
      <button class="btn pri" type="button" data-run="" style="margin-left:auto">전체 지금 점검</button></div>
    <div class="mapbox"><svg viewBox="-480 -300 960 600" role="img" aria-label="팀 에이전트 지도">
      <ellipse class="map-ring" rx="${RX}" ry="${RY}"/><ellipse class="map-ring" rx="${RX * .45}" ry="${RY * .45}" stroke-dasharray="2 6"/>
      ${links}<g class="map-core"><circle r="48"/><text x="0" y="5" text-anchor="middle">MASTER</text></g>${dnodes}${nodes}</svg></div>
    <div class="legend"><span><i style="background:#2f7a55"></i>작업 중 — 파동</span><span><i style="background:#8a5a00"></i>보고 중 — 대표에게 빠르게 흐름</span><span><i style="background:#b3392f"></i>막힘 — 마감·운영 확인 필요</span><span><i style="background:#5d5f64"></i>대기</span></div>
    ${detail}`;
}
function people(team) {
  const t = D.org.teams.find(x => x.key === team);
  if (!t) return '';
  return `<div><div class="sec-h"><h2>팀원</h2><span>${t.members.filter(p => p.hasAccount).length}/${t.members.length}명 ERP 계정</span></div>
    <div class="ppl">${t.members.map((p, i) => `<span class="${p.hasAccount ? '' : 'off'}">${esc(p.name)} <small>${esc(p.rank)}${i === 0 ? '·팀장' : ''}${p.hasAccount ? '' : ' · 계정 없음'}</small></span>`).join('')}</div></div>`;
}
function facts(a) {
  const f = Array.isArray(a.stats?.facts) ? a.stats.facts : [];
  if (!f.length) return '';
  return `<details class="facts"><summary>${a.liveFacts ? '현재 운영 점검' : '보고 당시 근거'} (ERP·PMS) ${num(a.stats?.alerts) ? '· 확인 조건 ' + num(a.stats.alerts) + '개' : ''}</summary>
    <pre>${esc(f.join('\n'))}</pre></details>`;
}
function watchForm(team) {
  const t = D.org.teams.find(x => x.key === team);
  if (!t) return '';
  const custom = t.rules && t.rules !== t.rulesDefault;
  return `<form class="order watch" data-team="${esc(team)}">
    <label for="w-t">이 팀에서 꼭 볼 것 <small>${custom ? '대표님이 고친 기준' : '기본 기준 — 고쳐 쓰세요'}</small></label>
    <textarea id="w-t" rows="3" maxlength="2000">${esc(t.rules)}</textarea>
    <div class="row"><button class="btn" type="submit">기준 저장</button><small>비워서 저장하면 기본 기준으로 돌아가요. 다음 점검부터 반영</small></div>
  </form>`;
}
function ordersOf(team) {
  const list = (D.orders || []).filter(o => o.team === team);
  if (!list.length) return '';
  const st = o => o.status === 'done' ? '완료' : o.status === 'cancelled' ? '취소' : !o.assignee_name ? '전달 대기 (계정 없음)' : o.dueDate && o.dueDate < D.today ? '마감 지남' : '진행 중';
  return `<div><div class="sec-h"><h2>내 지시</h2><span>최근 30일</span></div><div class="list">${list.map(o => `<div class="item"><span class="k ${o.status === 'done' ? '' : 'todo'}">${st(o)}</span>
    <div class="t"><p>${esc(o.text)}</p><small>${o.assignee_name ? '→ ' + esc(o.assignee_name) : ''}${o.dueDate ? ' · 마감 ' + esc(o.dueDate) : ''}${o.reply_text ? ' · ' + esc(o.reply_text) : ''}</small></div>
    <span class="when">${kst(o.created_at)}</span></div>`).join('')}</div></div>`;
}
document.getElementById('view').addEventListener('submit', async e => {
  const wf = e.target.closest('form.watch');
  if (wf) {
    e.preventDefault();
    const b = wf.querySelector('button'); b.disabled = true;
    try {
      await api('/api/ceo/watch', { team: wf.dataset.team, rules: wf.querySelector('textarea').value });
      await load();
      alertInline(document.querySelector('form.watch button'), '저장했어요. [이 팀 지금 점검]을 누르면 바로 반영돼요');
    } catch (err) { alertInline(b, err.message); b.disabled = false; }
    return;
  }
  const f = e.target.closest('form.order'); if (!f) return;
  e.preventDefault();
  const t = f.querySelector('textarea'), d = f.querySelector('input[type=date]'), b = f.querySelector('button');
  if (!t.value.trim()) { t.focus(); return; }
  b.disabled = true;
  try {
    const r = await api('/api/ceo/directive', { team: f.dataset.team, text: t.value.trim(), dueDate: d.value || '' });
    await load();
    alertInline(document.querySelector('form.order button'), r.delivered ? `${r.delivered}님에게 보냈어요` : '팀원 계정이 아직 없어 전달 대기로 남겼어요');
  } catch (err) { alertInline(b, err.message); b.disabled = false; }
});
document.getElementById('view').addEventListener('click', async e => {
  const node = e.target.closest('.map-node');
  if (node) { selTeam = node.dataset.team; render(); return; }
  const run = e.target.closest('button[data-run]');
  if (!run) return;
  const team = run.dataset.run || undefined;
  run.disabled = true; const label = run.textContent;
  const t0 = Date.now(); const tick = setInterval(() => { run.textContent = `점검 중… ${Math.floor((Date.now() - t0) / 1000)}초`; }, 500);
  try { await api('/api/ceo/agents/run', team ? { team } : {}); await load(); }
  catch (err) { alertInline(run, err.message); run.disabled = false; }
  finally { clearInterval(tick); run.textContent = label; }
});
document.getElementById('view').addEventListener('keydown', e => {
  const node = e.target.closest('.map-node');
  if (node && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selTeam = node.dataset.team; render(); }
});
window.addEventListener('hashchange', () => D && render());

// 승인함 버튼 — ERP 의 업무 카드 API 를 그대로 부른다 (권한은 서버가 다시 본다)
document.getElementById('view').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a;
  const inp = document.getElementById('r-' + id);
  const card = D.decide.find(c => c.id === id);
  try {
    b.disabled = true;
    if (a === 'reply') {
      if (!inp.value.trim()) { inp.focus(); b.disabled = false; return; }
      await api(`/api/work/${encodeURIComponent(id)}/reply`, { text: inp.value.trim() });
    } else if (a === 'done') {
      await api(`/api/work/${encodeURIComponent(id)}/done`, { note: inp?.value.trim() || '' });
    } else if (a === 'confirm') {
      const p = card?.parsed || {};
      if (!p.title || !p.startDate) { alertInline(b, '이름·날짜가 없어 ERP 업무 피드에서 채워 등록해야 해요'); b.disabled = false; return; }
      await api(`/api/work/${encodeURIComponent(id)}/confirm`, { payload: p, shareTeams: p.shareTeams || [] });
    }
    await load();
  } catch (err) { alertInline(b, err.message); b.disabled = false; }
});
// ───────── 접수 바로 승인
document.getElementById('view').addEventListener('toggle', e => {
  const d = e.target.closest?.('details.cap-item'); if (!d) return;
  d.open ? capOpen.add(d.dataset.capopen) : capOpen.delete(d.dataset.capopen);
}, true); // toggle 은 버블링이 안 돼서 캡처로 받는다
document.getElementById('view').addEventListener('input', e => {
  const f = e.target.closest('.cap-form'); const k = e.target.dataset?.k;
  if (f && k) (capEdit[f.dataset.cap] ||= {})[k] = e.target.value;
});
document.getElementById('view').addEventListener('click', async e => {
  const f = e.target.closest('.cap-form'); if (!f) return;
  const id = f.dataset.cap, c = D.captures.find(x => x.id === id); if (!c) return;
  const b = e.target.closest('[data-capact]'); if (!b || b.disabled) return;
  if (capBusy.has(id)) return; // 승인·반려가 겹쳐 나가지 않게 접수 단위로 잠근다 (코덱스 지적)
  const before = [...f.querySelectorAll('button')].map(x => x.disabled);
  capBusy.add(id); f.querySelectorAll('button').forEach(x => x.disabled = true);
  const unlock = () => { capBusy.delete(id); f.querySelectorAll('button').forEach((x, i) => x.disabled = before[i]); };
  try {
    if (b.dataset.capact === 'reject') {
      const reason = (f.querySelector('input[data-k="_reason"]')?.value || '').trim();
      if (!reason) { alertInline(b, '반려 사유를 적어주세요 (올린 사람에게 그대로 보여요)'); unlock(); return; }
      await api(`/api/captures/${encodeURIComponent(id)}/reject`, { reason });
    } else {
      // 올린 사람이 쓴 그대로 승인한다 — 콘솔에서 값을 바꾸지 않는다 (서버가 필수값을 다시 검사)
      await api(`/api/captures/${encodeURIComponent(id)}/approve`, { payload: { ...(c.parsed || {}), kind: c.kind } });
    }
    delete capEdit[id]; capBusy.delete(id); capOpen.delete(String(id));
    await load();
  } catch (err) { alertInline(b, err.message); unlock(); }
});
function alertInline(btn, msg) {
  let s = btn.parentElement.querySelector('.err'); if (!s) { s = document.createElement('small'); s.className = 'err'; s.style.flexBasis = '100%'; btn.parentElement.appendChild(s); }
  s.textContent = msg;
}

// ───────── 비서실장
const msgs = document.getElementById('msgs'), q = document.getElementById('q'), askBtn = document.getElementById('askBtn');
let history = [];
try { history = JSON.parse(sessionStorage.getItem('ceo-chat') || '[]'); } catch { history = []; }
history.forEach(h => bubble(h.role === 'user' ? 'u' : 'a', h.content));
if (history.length) document.getElementById('sugs').remove();

function bubble(cls, text) {
  const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
}
async function ask(text) {
  text = text.trim(); if (!text || askBtn.disabled) return;
  document.getElementById('sugs')?.remove();
  document.getElementById('aiErr').hidden = true;
  bubble('u', text); q.value = ''; autosize();
  const w = bubble('a wait', '살펴보는 중… 0초');
  const t0 = Date.now(); const tick = setInterval(() => { w.textContent = `살펴보는 중… ${Math.floor((Date.now() - t0) / 1000)}초 (보통 10~30초)`; }, 500);
  askBtn.disabled = true;
  try {
    const r = await api('/api/ceo/ask', { question: text, history: history.slice(-8) });
    w.className = 'm a'; w.textContent = r.answer;
    history.push({ role: 'user', content: text }, { role: 'assistant', content: r.answer });
    try { sessionStorage.setItem('ceo-chat', JSON.stringify(history.slice(-20))); } catch {}
  } catch (e) {
    w.remove(); const er = document.getElementById('aiErr'); er.hidden = false; er.textContent = '답을 받지 못했어요: ' + e.message;
  } finally { clearInterval(tick); askBtn.disabled = false; msgs.scrollTop = msgs.scrollHeight; }
}
document.getElementById('askForm').addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value); } });
function autosize() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 160) + 'px'; }
q.addEventListener('input', autosize);
document.getElementById('sugs')?.addEventListener('click', e => { const b = e.target.closest('button'); if (b) ask(b.textContent); });

// 좁은 화면: 비서실장은 오른쪽에서 열리는 서랍
const ai = document.getElementById('ai'), close = document.getElementById('aiClose');
document.getElementById('aiToggle').addEventListener('click', () => { ai.classList.add('open'); close.hidden = false; q.focus(); });
close.addEventListener('click', () => { ai.classList.remove('open'); close.hidden = true; });

load();
setInterval(load, 120000); // 2분마다 새로 읽는다
</script>
</body>
</html>
